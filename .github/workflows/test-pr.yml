name: Test PR

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      # The repo's strongest property is that it compiles clean in strict mode
      # with no `any` and no @ts-ignore. Nothing verified that until now, so the
      # discipline was upheld by hand.
      - name: Type check
        run: npx tsc --noEmit

      - name: Run tests
        run: npm test

      # The same command the editor, the pre-commit hook and the CLI use.
      # ESLint owns code, rules and formatting both (eslint-plugin-prettier);
      # Prettier covers what ESLint does not lint, such as Markdown and JSON.
      - name: Lint
        run: npm run lint

      # A dependency added without regenerating leaves the app shipping code it does
      # not attribute, which is the one clear way to breach MIT and BSD.
      #
      # Regenerate and let git judge, rather than `licenses:check`: postinstall has
      # already run --if-stale by this point, so the file on disk is current either
      # way and a byte-compare would pass over a stale COMMIT. The full run (no
      # --if-stale) also catches a generated file edited by hand.
      - name: Licenses are current
        run: npm run licenses && git diff --exit-code constants/bundled-licenses.ts

      # The playback suite itself needs a booted simulator, a built app and a Jellyfin
      # carrying the fixture libraries, so it stays local and this is the half CI can
      # hold: every item that records a baseline has one, and no baseline outlives its
      # item. Mode and progress assertions are NOT covered here.
      - name: Playback manifest and baselines agree
        run: npm run test:playback:manifest

      # The screenshot compositor's output goes to App Store Connect, where an image under
      # the wrong caption is a listing error. jest cannot see .mjs, so assign() is gated the
      # same way the manifest is: a node run that exits non-zero.
      - name: Screenshot slots hold their own captions
        run: npm run test:shots

  # Package.swift is platforms: [.macOS(.v14)] and links the FFmpeg xcframeworks, which
  # scripts/fetch-ffmpeg.js refuses to download off darwin. The engine cannot ride the
  # ubuntu job.
  engine:
    runs-on: macos-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      # postinstall fetches and checksums the xcframeworks the package links against.
      - name: Install dependencies
        run: npm ci

      # The codec matrices generate their fixtures with a host ffmpeg and XCTSkip without one,
      # so a runner that has none still proves the rest: Dolby Vision conversion against
      # committed RPU fixtures, the master playlist rules, and the segment grid.
      - name: Engine tests
        run: npm run test:engine
